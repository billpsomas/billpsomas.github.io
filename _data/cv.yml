  image: ""
  summary: MSCA Postdoctoral Fellow at the Visual Recognition Group of Czech Technical University in Prague, working on RAVIOLI (Retrieval-Augmented VIsion-Language Models for Open-vocabulary LocalizatIon). My research focuses on visual and multimodal representation learning, with eight papers at CVPR, ICCV, ECCV, ICLR and NeurIPS. I am affiliated with the Good AI Lab and a member of the ELLIS Society, where I serve as an evaluator for the ELLIS PhD program. I am an Area Chair for ICLR 2027 and ICML 2027.

